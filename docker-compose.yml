version: '3.8' 
 
services: 
  backend: 
    build: 
      context: ./backend 
      dockerfile: Dockerfile 
    container_name: moveai-backend 
    restart: always 
    ports: 
      - "3000:3000" 
    env_file: 
      - ./backend/.env 
 
  ai-service: 
    build: 
      context: ./ai-service 
      dockerfile: Dockerfile 
    container_name: moveai-ai 
    restart: always 
ports: - "8000:8000" 
env_file: - ./ai-service/.env