name: Deploy backend to Windows server

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "ai-service/**"
      - "datasets/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".dockerignore"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: moveai-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart services over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script_stop: true
          script: |
            powershell -NoProfile -NonInteractive -Command "Set-Location -LiteralPath 'C:\MOVEAI'; git pull --ff-only origin main; $lines = @('DB_HOST=database','DB_PORT=3306','DB_NAME=${{ secrets.DB_NAME }}','DB_USER=${{ secrets.DB_USER }}','DB_PASSWORD=${{ secrets.DB_PASSWORD }}','AI_SERVICE_URL=http://ai-service:8000','GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}','LLM_MODEL=${{ secrets.LLM_MODEL }}','LLM_THINKING_LEVEL=${{ secrets.LLM_THINKING_LEVEL }}','EMBEDDING_MODEL=${{ secrets.EMBEDDING_MODEL }}','EMBEDDING_DIMENSION=${{ secrets.EMBEDDING_DIMENSION }}','EMBEDDING_BATCH_SIZE=50','STT_MODEL=${{ secrets.STT_MODEL }}','STT_MAX_FILE_BYTES=${{ secrets.STT_MAX_FILE_BYTES }}','KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}','KAKAO_LOCAL_API_URL=${{ secrets.KAKAO_LOCAL_API_URL }}','KAKAO_MOBILITY_API_URL=${{ secrets.KAKAO_MOBILITY_API_URL }}','AUDIO_STORAGE_PATH=/data/audio','SPRING_PROFILES_ACTIVE=${{ secrets.SPRING_PROFILES_ACTIVE }}','API_DOMAIN=${{ secrets.API_DOMAIN }}','CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}'); [System.IO.File]::WriteAllLines('C:\MOVEAI\.env', $lines, [System.Text.UTF8Encoding]::new($false)); & '.\scripts\deploy-remote.ps1'"
