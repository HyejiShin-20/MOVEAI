server:
  port: 8080

spring:
  application:
    name: moveai-backend
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:moveai}?characterEncoding=utf8mb4
    username: ${DB_USER:moveai}
    password: ${DB_PASSWORD:moveai}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      # DB가 안 떠 있어도 앱은 뜨고 /health 가 down 을 보고해야 한다.
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      # 스키마는 05A의 DDL로 만든다. Hibernate가 테이블을 건드리지 않게 한다.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

moveai:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  dataset:
    # bootRun 의 작업 디렉터리는 backend/ 다. 임포트 대상은 저장소 루트의 datasets/ 뿐이며
    # docs/dataset/ 은 작성 이력이라 임포트하지 않는다 (05A §3-1).
    dir: ${DATASET_DIR:../datasets}
  cors:
    # Vite 기본 포트. 화면 담당이 다른 포트를 쓰면 CORS_ALLOWED_ORIGINS 로 넘긴다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

logging:
  level:
    com.moveai: INFO
