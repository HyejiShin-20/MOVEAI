server:
  port: 8080

spring:
  application:
    name: moveai-backend
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:moveai}?characterEncoding=utf8mb4
    username: ${DB_USER:moveai}
    password: ${DB_PASSWORD:moveai}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      # DB가 안 떠 있어도 앱은 뜨고 /health 가 down 을 보고해야 한다.
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      # 스키마는 05A의 DDL로 만든다. Hibernate가 테이블을 건드리지 않게 한다.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

moveai:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    com.moveai: INFO
