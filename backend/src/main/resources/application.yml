spring:
  application:
    name: move-ai-backend
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/move_ai}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

move-ai:
  security:
    admin-token: ${MOVE_AI_ADMIN_TOKEN:}
    driver-token: ${MOVE_AI_DRIVER_TOKEN:}
  ai:
    stt:
      mode: ${STT_MODE:mock}
    extraction:
      mode: ${EXTRACTION_MODE:mock}
    embedding:
      mode: ${EMBEDDING_MODE:mock}

logging:
  level:
    com.moveai: INFO
